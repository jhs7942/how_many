<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>투표 대기 — 몇명이니</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .wait-hero {
      text-align: center;
      padding: 20px 0 24px;
    }

    .wait-spinner-wrap {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto 16px;
    }

    .wait-spinner-bg {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .wait-spinner-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--primary);
      animation: spin 1.2s linear infinite;
    }

    .wait-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 4px;
    }

    .wait-desc {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .progress-section {
      margin-bottom: 20px;
    }

    .progress-numbers {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .progress-voted {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
    }

    .progress-total {
      font-size: 14px;
      color: var(--text-secondary);
      align-self: flex-end;
      padding-bottom: 3px;
    }

    .timer-section {
      text-align: center;
      margin-bottom: 20px;
    }

    .close-btn-wrap {
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <a href="group-invite.html" class="btn-back">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>
      <span class="page-title">투표 대기 중</span>
      <span class="badge badge-primary" id="roomCodeBadge">--</span>
    </div>

    <div class="page-content">
      <!-- 대기 헤더 -->
      <div class="wait-hero">
        <div class="wait-spinner-wrap">
          <div class="wait-spinner-bg">🗳️</div>
          <div class="wait-spinner-ring"></div>
        </div>
        <p class="wait-title">친구들이 투표 중이에요</p>
        <p class="wait-desc">모두 완료되면 결과를 확인할 수 있어요</p>
      </div>

      <!-- 진행률 -->
      <div class="progress-section">
        <div class="progress-numbers">
          <span class="progress-voted"><span id="votedCount">3</span>명 완료</span>
          <span class="progress-total">/ <span id="totalCount">5</span>명</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <!-- 타이머 -->
      <div class="timer-section">
        <div class="timer-display" id="timerDisplay">05:00</div>
        <div class="timer-label">남은 시간</div>
      </div>

      <!-- 참여자 목록 -->
      <p class="section-title">👥 참여 현황</p>
      <div class="participant-list" id="participantList">
        <!-- JS로 렌더링 -->
      </div>

      <div class="btn-stack">
        <div class="close-btn-wrap">
          <button class="btn btn-secondary btn-full" id="btnForceClose">
            ✂️ 방장 강제 마감
          </button>
        </div>
        <a href="group-result.html" class="btn btn-primary btn-full" id="btnGoResult" style="display:none">
          결과 보기 →
        </a>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="../js/main.js"></script>
  <script>
    const { session, showToast, DUMMY_PARTICIPANTS } = HowMany;

    const roomCode = session.get('roomCode') || 'DEMO';
    const totalCount = session.get('groupPeopleCount') || 5;
    const myNickname = session.get('myNickname');
    const myEmoji = session.get('myEmoji') || '🙂';

    document.getElementById('roomCodeBadge').textContent = roomCode.slice(0, 3) + '...';
    document.getElementById('totalCount').textContent = totalCount;

    // 더미 참여자 목록 생성
    const participants = DUMMY_PARTICIPANTS.slice(0, Math.min(totalCount, DUMMY_PARTICIPANTS.length));
    if (myNickname) {
      participants[0] = { name: myNickname, voted: !!localStorage.getItem(`voted_${roomCode}`), emoji: myEmoji };
    }

    let votedCount = participants.filter(p => p.voted).length;

    function renderParticipants() {
      const list = document.getElementById('participantList');
      list.innerHTML = '';
      participants.forEach(p => {
        const item = document.createElement('div');
        item.className = 'participant-item animate-fade-in';
        item.innerHTML = `
          <div class="participant-avatar">${p.emoji}</div>
          <span class="participant-name">${p.name}</span>
          <span class="participant-status ${p.voted ? 'voted' : 'waiting'}">
            ${p.voted ? '✅ 투표 완료' : '⏳ 대기 중'}
          </span>
        `;
        list.appendChild(item);
      });
    }

    function updateProgress() {
      votedCount = participants.filter(p => p.voted).length;
      document.getElementById('votedCount').textContent = votedCount;
      const pct = Math.round((votedCount / totalCount) * 100);
      document.getElementById('progressFill').style.width = pct + '%';

      // 모두 완료
      if (votedCount >= totalCount) {
        clearInterval(timerInterval);
        showToast('🎉 모두 투표 완료! 결과를 확인하세요');
        document.getElementById('btnGoResult').style.display = 'flex';
        document.getElementById('btnForceClose').style.display = 'none';
        setTimeout(() => { window.location.href = 'group-result.html'; }, 1500);
      }
    }

    renderParticipants();
    updateProgress();

    // 타이머 (5분)
    let remaining = 5 * 60;

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    const timerDisplay = document.getElementById('timerDisplay');

    const timerInterval = setInterval(() => {
      remaining--;
      timerDisplay.textContent = formatTime(remaining);

      // 더미 — 30초마다 한 명씩 완료
      if (remaining % 30 === 0) {
        const waiting = participants.findIndex(p => !p.voted);
        if (waiting >= 0) {
          participants[waiting].voted = true;
          renderParticipants();
          updateProgress();
        }
      }

      if (remaining <= 0) {
        clearInterval(timerInterval);
        showToast('⏰ 시간이 종료되었어요');
        setTimeout(() => { window.location.href = 'group-result.html'; }, 1500);
      }

      // 30초 이하 빨간색
      if (remaining <= 30) {
        timerDisplay.style.color = '#E53935';
      }
    }, 1000);

    // 강제 마감
    document.getElementById('btnForceClose').addEventListener('click', () => {
      clearInterval(timerInterval);
      showToast('방장이 투표를 마감했어요');
      setTimeout(() => { window.location.href = 'group-result.html'; }, 800);
    });
  </script>
</body>
</html>
