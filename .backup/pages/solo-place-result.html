<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>장소 결과 — 몇명이니</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .result-wrap {
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-top: 8px;
    }

    .journey-steps {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--bg-card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    .step-chip {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 700;
      background: var(--accent);
      padding: 5px 10px;
      border-radius: var(--radius-full);
      color: var(--primary-dark);
    }

    .step-arrow {
      color: var(--primary);
      font-size: 14px;
    }

    .map-btn-row {
      display: flex;
      gap: 10px;
    }

    .map-btn {
      flex: 1;
      padding: 14px 12px;
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      transition: all var(--transition);
      box-shadow: var(--shadow);
    }

    .map-btn:active {
      transform: scale(0.95);
    }

    .map-kakao {
      background: #FEE500;
      color: #3C1E1E;
    }

    .map-naver {
      background: #03C75A;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <a href="solo-place-spin.html" class="btn-back">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>
      <span class="page-title">장소 결정!</span>
    </div>

    <div class="page-content">
      <div class="result-wrap">
        <!-- 여정 표시 -->
        <div class="journey-steps" id="journeySteps">
          <span class="step-chip" id="activityChip">🎲 --</span>
          <span class="step-arrow">→</span>
          <span class="step-chip" id="placeChip">📍 --</span>
        </div>

        <!-- 결과 카드 -->
        <div class="result-card animate-scale-in">
          <span class="result-emoji" id="placeEmoji">📍</span>
          <p class="result-label">오늘의 장소 유형</p>
          <p class="result-text" id="placeText">--</p>
        </div>

        <!-- 지도 검색 -->
        <div>
          <p class="section-title">🗺️ 지도에서 찾기</p>
          <div class="map-btn-row">
            <a id="kakaoMapBtn" href="#" class="map-btn map-kakao" target="_blank">
              📍 카카오지도
            </a>
            <a id="naverMapBtn" href="#" class="map-btn map-naver" target="_blank">
              📍 네이버지도
            </a>
          </div>
        </div>

        <div class="btn-stack">
          <button class="btn btn-outline btn-full" id="btnShare">
            📋 공유하기
          </button>
          <a href="solo-place-spin.html" class="btn btn-secondary btn-full">
            🔄 다시 돌리기
          </a>
          <a href="../index.html" class="btn btn-primary btn-full">
            🏠 처음으로
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script>
    const { session, copyToClipboard } = HowMany;

    const activity = session.get('activityResult');
    const place = session.get('placeResult');

    if (activity) {
      document.getElementById('activityChip').textContent = `${activity.emoji} ${activity.label}`;
    }

    if (place) {
      document.getElementById('placeChip').textContent = `📍 ${place.label}`;
      document.getElementById('placeEmoji').textContent = place.emoji;
      document.getElementById('placeText').textContent = place.label;

      // 지도 검색 링크 (더미 — 실제 검색 페이지로 연결)
      const query = encodeURIComponent(place.label + ' 근처');
      document.getElementById('kakaoMapBtn').href =
        `https://map.kakao.com/link/search/${encodeURIComponent(place.label)}`;
      document.getElementById('naverMapBtn').href =
        `https://map.naver.com/v5/search/${encodeURIComponent(place.label)}`;
    } else {
      window.location.href = 'solo-place-spin.html';
    }

    document.getElementById('btnShare').addEventListener('click', () => {
      const text = activity && place
        ? `오늘 ${activity.label} → ${place.label} 어때요? 몇명이니가 골라줬어요! 🎲`
        : '몇명이니로 오늘 뭐 할지 골라봐요!';
      copyToClipboard(text);
    });
  </script>
</body>
</html>
