<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#FF7A3D" />
  <title>몇명이니 — 모임 결정 서비스</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ===== 스플래시 ===== */
    #splash {
      position: fixed;
      inset: 0;
      background: var(--primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity 0.6s ease, transform 0.6s ease;
      max-width: 430px;
      margin: 0 auto;
    }

    #splash.hide {
      opacity: 0;
      transform: scale(1.05);
      pointer-events: none;
    }

    .splash-logo {
      font-size: 64px;
      margin-bottom: 16px;
      animation: bounce 1.2s ease infinite;
    }

    .splash-title {
      font-size: 30px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
    }

    .splash-subtitle {
      font-size: 15px;
      color: rgba(255,255,255,0.78);
      margin-top: 8px;
      font-weight: 500;
    }

    /* ===== 홈 화면 ===== */
    #home {
      display: none;
      min-height: 100vh;
      min-height: 100dvh;
      flex-direction: column;
      padding: 0 20px 40px;
    }

    #home.show {
      display: flex;
      animation: fadeIn 0.5s ease forwards;
    }

    .home-header {
      padding: 28px 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .home-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .home-logo-emoji {
      font-size: 28px;
    }

    .home-logo-text {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
    }

    .home-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px 0;
    }

    .hero-title {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.3;
      color: var(--text);
      margin-bottom: 10px;
    }

    .hero-title span {
      color: var(--primary);
    }

    .hero-desc {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 36px;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .mode-card {
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
      border: 2px solid transparent;
      cursor: pointer;
      transition: all var(--transition);
      text-decoration: none;
    }

    .mode-card:hover,
    .mode-card:active {
      border-color: var(--primary);
      background: var(--accent);
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
    }

    .mode-card:active {
      transform: translateY(-1px) scale(0.97);
    }

    .mode-emoji {
      font-size: 40px;
    }

    .mode-label {
      font-size: 16px;
      font-weight: 800;
      color: var(--text);
    }

    .mode-desc {
      font-size: 12px;
      color: var(--text-secondary);
      text-align: center;
      line-height: 1.4;
    }

    .home-footer {
      text-align: center;
      font-size: 13px;
      color: var(--text-secondary);
      padding-top: 16px;
    }

    /* 파티클 배경 */
    .particles {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: var(--accent);
      animation: particleFloat linear infinite;
      opacity: 0.5;
    }

    @keyframes particleFloat {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 0.5; }
      90% { opacity: 0.5; }
      100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>
  <!-- 스플래시 화면 -->
  <div id="splash">
    <div class="splash-logo">🎲</div>
    <div class="splash-title">몇명이니</div>
    <div class="splash-subtitle">모임 결정, 10초면 충분해</div>
  </div>

  <!-- 홈 화면 -->
  <div id="home">
    <div class="home-header">
      <div class="home-logo">
        <span class="home-logo-emoji">🎲</span>
        <span class="home-logo-text">몇명이니</span>
      </div>
      <span class="badge badge-primary">Beta</span>
    </div>

    <div class="home-hero">
      <h1 class="hero-title">
        오늘 뭐 할지<br />
        <span>10초</span>에 결정해요
      </h1>
      <p class="hero-desc">
        단톡방 30분 토론은 이제 그만!<br />
        혼자도, 같이도 빠르게 결정해요.
      </p>

      <div class="mode-grid">
        <a href="pages/solo-people.html" class="mode-card">
          <span class="mode-emoji">🙋</span>
          <span class="mode-label">혼자 결정</span>
          <span class="mode-desc">내가 대표로<br />빠르게 정할게</span>
        </a>
        <a href="pages/group-create.html" class="mode-card">
          <span class="mode-emoji">👥</span>
          <span class="mode-label">같이 결정</span>
          <span class="mode-desc">모두가 참여하는<br />공정한 투표</span>
        </a>
      </div>
    </div>

    <div class="home-footer">
      모임 결정 피로, 이제 몇명이니가 해결할게요 🧡
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    // 스플래시 → 홈 전환 (2초 후)
    setTimeout(() => {
      const splash = document.getElementById('splash');
      const home = document.getElementById('home');
      splash.classList.add('hide');
      setTimeout(() => {
        splash.style.display = 'none';
        home.classList.add('show');
      }, 600);
    }, 2000);
  </script>
</body>
</html>
