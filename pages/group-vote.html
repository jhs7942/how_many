<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>투표 화면 — 몇명이니</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .vote-header-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .voter-name {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .vote-secret-notice {
      background: var(--accent);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 13px;
      color: var(--primary-dark);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    .vote-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .voted-state {
      display: none;
      text-align: center;
      padding: 32px 20px;
      animation: scaleIn 0.35s ease forwards;
    }

    .voted-state.show {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .voted-emoji {
      font-size: 56px;
    }

    .voted-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
    }

    .voted-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <a href="group-nickname.html" class="btn-back" id="backBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>
      <div class="vote-header-info">
        <span class="page-title">투표하기</span>
        <span class="voter-name" id="voterName">-- 님</span>
      </div>
      <span class="badge badge-primary" id="roomCodeBadge">방 --</span>
    </div>

    <div class="page-content">
      <!-- 투표 전 -->
      <div id="voteArea">
        <div class="vote-secret-notice">
          🔒 마감 전까지 결과는 비공개예요
        </div>

        <p class="section-title">하나를 골라주세요</p>

        <div class="vote-list" id="voteList">
          <!-- JS로 렌더링 -->
        </div>

        <div class="btn-stack">
          <button class="btn btn-primary btn-full" id="btnSubmit" disabled>
            투표 제출하기
          </button>
        </div>
      </div>

      <!-- 투표 완료 -->
      <div class="voted-state" id="votedState">
        <span class="voted-emoji">✅</span>
        <p class="voted-title">투표 완료!</p>
        <p class="voted-desc">다른 친구들도 투표를 마치면<br />결과를 확인할 수 있어요</p>
        <a href="group-wait.html" class="btn btn-primary" style="margin-top:8px;padding:14px 32px">
          대기 화면으로 →
        </a>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="../js/main.js"></script>
  <script>
    const { session, showToast } = HowMany;

    const nickname = session.get('myNickname') || '익명';
    const myEmoji = session.get('myEmoji') || '🙂';
    const roomCode = session.get('roomCode');
    const candidates = session.get('groupCandidates') || HowMany.DUMMY_VOTE_RESULTS.map(v => ({ label: v.label, emoji: v.emoji }));

    document.getElementById('voterName').textContent = `${myEmoji} ${nickname} 님`;
    if (roomCode) document.getElementById('roomCodeBadge').textContent = `방 ${roomCode.slice(0, 3)}`;

    // 이미 투표했는지 확인 (LocalStorage)
    const hasVoted = localStorage.getItem(`voted_${roomCode}`);
    if (hasVoted) {
      document.getElementById('voteArea').style.display = 'none';
      document.getElementById('votedState').classList.add('show');
    }

    let selectedIndex = -1;

    const voteList = document.getElementById('voteList');
    candidates.forEach((c, i) => {
      const card = document.createElement('div');
      card.className = 'vote-card';
      card.innerHTML = `
        <span class="vote-icon">${c.emoji}</span>
        <span class="vote-label">${c.label}</span>
        <span class="vote-check"></span>
      `;
      card.addEventListener('click', () => {
        document.querySelectorAll('.vote-card').forEach(v => v.classList.remove('selected'));
        card.classList.add('selected');
        selectedIndex = i;
        document.getElementById('btnSubmit').disabled = false;
      });
      voteList.appendChild(card);
    });

    document.getElementById('btnSubmit').addEventListener('click', () => {
      if (selectedIndex < 0) return;

      // 투표 저장
      localStorage.setItem(`voted_${roomCode}`, candidates[selectedIndex].label);

      // 버튼 비활성화
      document.getElementById('btnSubmit').disabled = true;
      document.querySelectorAll('.vote-card').forEach(v => {
        v.style.pointerEvents = 'none';
      });

      // 완료 화면 전환
      setTimeout(() => {
        document.getElementById('voteArea').style.display = 'none';
        document.getElementById('votedState').classList.add('show');
      }, 400);
    });
  </script>
</body>
</html>
