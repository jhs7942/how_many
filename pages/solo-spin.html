<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>활동 돌림판 — 몇명이니</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .spin-header-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .spin-hint {
      text-align: center;
      font-size: 14px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    .spin-result-hint {
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      min-height: 24px;
      animation: scaleIn 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <a href="solo-people.html" class="btn-back">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>
      <div class="spin-header-info">
        <span class="page-title">활동 고르기</span>
        <span class="badge badge-primary" id="peopleBadge">--명</span>
      </div>
    </div>

    <div class="page-content">
      <div class="wheel-wrapper">
        <div class="wheel-container">
          <div class="wheel-pointer"></div>
          <canvas id="wheelCanvas" class="wheel-canvas"></canvas>
        </div>

        <div class="spin-result-hint" id="spinResultHint"></div>

        <button class="btn-spin" id="spinBtn">SPIN</button>
      </div>

      <p class="spin-hint">버튼을 눌러 돌림판을 돌려보세요!</p>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script>
    const { SpinWheel, ACTIVITY_DATA, session, showToast } = HowMany;

    // 인원 수 불러오기 (없으면 기본 4명)
    const count = session.get('peopleCount') || 4;
    const key = count >= 6 ? 6 : count <= 2 ? 2 : count;
    const segments = ACTIVITY_DATA[key] || ACTIVITY_DATA[4];

    document.getElementById('peopleBadge').textContent = `${count >= 6 ? '6' : count}명`;

    const canvas = document.getElementById('wheelCanvas');
    const wheel = new SpinWheel(canvas, segments);
    const spinBtn = document.getElementById('spinBtn');
    const hint = document.getElementById('spinResultHint');

    spinBtn.addEventListener('click', () => {
      if (wheel.isSpinning) return;
      hint.textContent = '';
      spinBtn.disabled = true;
      spinBtn.textContent = '...';

      wheel.spin((result) => {
        hint.textContent = `🎉 ${result.label}`;
        hint.style.animation = 'none';
        void hint.offsetWidth;
        hint.style.animation = 'scaleIn 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards';

        // 결과 저장
        session.set('activityResult', result);

        spinBtn.textContent = '이동';
        spinBtn.disabled = false;
        spinBtn.style.background = 'var(--primary)';
        spinBtn.style.fontSize = '14px';

        spinBtn.addEventListener('click', () => {
          window.location.href = 'solo-result.html';
        }, { once: true });
      });
    });
  </script>
</body>
</html>
