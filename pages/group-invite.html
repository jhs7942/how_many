<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>초대 공유 — 몇명이니</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .step-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
    }

    .step-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--border);
    }

    .step-dot.active {
      background: var(--primary);
      width: 20px;
      border-radius: 4px;
    }

    .invite-hero {
      text-align: center;
      padding: 16px 0 24px;
    }

    .invite-hero-emoji {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .invite-hero-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 6px;
    }

    .invite-hero-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .link-box {
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow);
    }

    .link-text {
      flex: 1;
      font-size: 13px;
      color: var(--text-secondary);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-copy-mini {
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      background: var(--primary);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      transition: all var(--transition);
      flex-shrink: 0;
    }

    .btn-copy-mini:active {
      transform: scale(0.95);
    }

    .candidates-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .candidate-preview-chip {
      background: var(--accent);
      color: var(--primary-dark);
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <a href="group-create.html" class="btn-back">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>
      <span class="page-title">친구 초대하기</span>
    </div>

    <div class="page-content">
      <div class="step-indicator">
        <div class="step-dot"></div>
        <div class="step-dot active"></div>
        <div class="step-dot"></div>
        <div class="step-dot"></div>
      </div>

      <div class="invite-hero">
        <div class="invite-hero-emoji">🔗</div>
        <p class="invite-hero-title">방이 만들어졌어요!</p>
        <p class="invite-hero-desc">아래 방 코드나 링크를 공유해서<br />친구들을 초대해요</p>
      </div>

      <!-- 방 코드 -->
      <div style="margin-bottom:16px">
        <p class="section-title">🔑 방 코드</p>
        <div class="code-box" id="codeBox" style="cursor:pointer">
          <div class="code-value" id="codeValue">------</div>
          <div class="code-label">탭하여 복사</div>
        </div>
      </div>

      <!-- 초대 링크 -->
      <div style="margin-bottom:20px">
        <p class="section-title">🌐 초대 링크</p>
        <div class="link-box">
          <span class="link-text" id="inviteLink">--</span>
          <button class="btn-copy-mini" id="btnCopyLink">복사</button>
        </div>
      </div>

      <!-- 후보 미리보기 -->
      <div style="margin-bottom:20px">
        <p class="section-title">🗳️ 투표 후보</p>
        <div class="candidates-preview" id="candidatesPreview"></div>
      </div>

      <div class="btn-stack">
        <button class="btn btn-outline btn-full" id="btnCopyAll">
          📋 코드 + 링크 한번에 복사
        </button>
        <a href="group-wait.html" class="btn btn-primary btn-full">
          ✅ 초대 완료, 대기 화면으로
        </a>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="../js/main.js"></script>
  <script>
    const { session, copyToClipboard, showToast } = HowMany;

    const roomCode = session.get('roomCode') || HowMany.generateRoomCode();
    const candidates = session.get('groupCandidates') || [];

    // 방 코드 표시
    document.getElementById('codeValue').textContent = roomCode;

    // 초대 링크 (더미)
    const dummyLink = `howmany.app/join/${roomCode.toLowerCase()}`;
    document.getElementById('inviteLink').textContent = dummyLink;

    // 방 코드 클릭 복사
    document.getElementById('codeBox').addEventListener('click', () => {
      copyToClipboard(roomCode);
    });

    // 링크 복사
    document.getElementById('btnCopyLink').addEventListener('click', () => {
      copyToClipboard(`https://${dummyLink}`);
    });

    // 한번에 복사
    document.getElementById('btnCopyAll').addEventListener('click', () => {
      copyToClipboard(`[몇명이니] 투표 방에 참여해요!\n방 코드: ${roomCode}\n링크: https://${dummyLink}`);
    });

    // 후보 미리보기
    const preview = document.getElementById('candidatesPreview');
    candidates.forEach(c => {
      const chip = document.createElement('span');
      chip.className = 'candidate-preview-chip';
      chip.textContent = `${c.emoji} ${c.label}`;
      preview.appendChild(chip);
    });
  </script>
</body>
</html>
