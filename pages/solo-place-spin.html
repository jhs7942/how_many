<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>장소 돌림판 — 몇명이니</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .activity-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent);
      color: var(--primary-dark);
      padding: 6px 14px;
      border-radius: var(--radius-full);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .spin-result-hint {
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      min-height: 24px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <a href="solo-result.html" class="btn-back">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>
      <span class="page-title">장소 고르기</span>
    </div>

    <div class="page-content">
      <div style="text-align:center;padding-top:8px">
        <div class="activity-chip" id="activityChip">🎲 활동</div>
        <p style="font-size:14px;color:var(--text-secondary)">활동에 맞는 장소 유형을 골라드릴게요</p>
      </div>

      <div class="wheel-wrapper" style="margin-top:16px">
        <div class="wheel-container">
          <div class="wheel-pointer"></div>
          <canvas id="wheelCanvas" class="wheel-canvas"></canvas>
        </div>

        <div class="spin-result-hint" id="spinResultHint"></div>

        <button class="btn-spin" id="spinBtn">SPIN</button>
      </div>

      <p style="text-align:center;font-size:14px;color:var(--text-secondary);margin-top:4px">
        버튼을 눌러 장소 유형을 뽑아요!
      </p>
    </div>
  </div>

  <script src="../js/main.js"></script>
  <script>
    const { SpinWheel, PLACE_DATA, session, showToast } = HowMany;

    const activityResult = session.get('activityResult');
    const activityLabel = activityResult?.label || '카페';
    const activityEmoji = activityResult?.emoji || '☕';

    document.getElementById('activityChip').textContent = `${activityEmoji} ${activityLabel} 장소`;

    // 장소 데이터 불러오기 (없으면 카페 기본)
    const segments = PLACE_DATA[activityLabel] || PLACE_DATA['카페'];

    const canvas = document.getElementById('wheelCanvas');
    const wheel = new SpinWheel(canvas, segments);
    const spinBtn = document.getElementById('spinBtn');
    const hint = document.getElementById('spinResultHint');

    spinBtn.addEventListener('click', () => {
      if (wheel.isSpinning) return;
      hint.textContent = '';
      spinBtn.disabled = true;
      spinBtn.textContent = '...';

      wheel.spin((result) => {
        hint.textContent = `📍 ${result.label}`;
        hint.style.animation = 'none';
        void hint.offsetWidth;
        hint.style.animation = 'scaleIn 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards';

        session.set('placeResult', result);

        spinBtn.textContent = '이동';
        spinBtn.disabled = false;

        spinBtn.addEventListener('click', () => {
          window.location.href = 'solo-place-result.html';
        }, { once: true });
      });
    });
  </script>
</body>
</html>
