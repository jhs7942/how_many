<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>닉네임 입력 — 몇명이니</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .nickname-hero {
      text-align: center;
      padding: 32px 0 28px;
    }

    .nickname-hero-emoji {
      font-size: 52px;
      margin-bottom: 14px;
      display: block;
      animation: bounce 1.4s ease-in-out infinite;
    }

    .nickname-hero-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
    }

    .nickname-hero-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    .room-code-display {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--accent);
      padding: 10px 16px;
      border-radius: var(--radius-full);
      margin-bottom: 28px;
    }

    .room-code-display .label {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .room-code-display .code {
      font-size: 16px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: 3px;
    }

    .emoji-picker {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 20px;
    }

    .emoji-option {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 2px solid var(--border);
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      box-shadow: var(--shadow);
    }

    .emoji-option:active,
    .emoji-option.selected {
      border-color: var(--primary);
      background: var(--accent);
      transform: scale(1.1);
    }

    .char-count {
      text-align: right;
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="page-header">
      <a href="../index.html" class="btn-back">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </a>
      <span class="page-title">참여하기</span>
    </div>

    <div class="page-content">
      <div class="nickname-hero">
        <span class="nickname-hero-emoji">👋</span>
        <p class="nickname-hero-title">반가워요!</p>
        <p class="nickname-hero-desc">닉네임을 입력하고<br />투표에 참여해요</p>
      </div>

      <!-- 방 코드 표시 -->
      <div class="room-code-display" id="roomCodeDisplay" style="display:none">
        <span class="label">방 코드</span>
        <span class="code" id="roomCodeText">------</span>
      </div>

      <!-- 이모지 선택 -->
      <p class="section-title" style="text-align:center;justify-content:center">나를 나타낼 이모지 선택</p>
      <div class="emoji-picker" id="emojiPicker">
        <!-- JS로 렌더링 -->
      </div>

      <!-- 닉네임 입력 -->
      <div>
        <input
          class="input-field"
          id="nicknameInput"
          type="text"
          placeholder="닉네임 입력 (최대 8자)"
          maxlength="8"
          autofocus
        />
        <p class="char-count"><span id="charCount">0</span> / 8</p>
      </div>

      <div class="btn-stack">
        <button class="btn btn-primary btn-full" id="btnJoin" disabled>
          투표하러 가기 →
        </button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script src="../js/main.js"></script>
  <script>
    const { session, showToast } = HowMany;

    const EMOJIS = ['🐯', '🦊', '🐧', '🐰', '🦁', '🐸', '🦋', '🐬', '🦄', '🐼'];
    let selectedEmoji = EMOJIS[0];

    // 방 코드 표시
    const roomCode = session.get('roomCode');
    if (roomCode) {
      document.getElementById('roomCodeDisplay').style.display = 'flex';
      document.getElementById('roomCodeText').textContent = roomCode;
    }

    // 이모지 선택
    const picker = document.getElementById('emojiPicker');
    EMOJIS.forEach((emoji, i) => {
      const btn = document.createElement('button');
      btn.className = 'emoji-option' + (i === 0 ? ' selected' : '');
      btn.textContent = emoji;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.emoji-option').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedEmoji = emoji;
      });
      picker.appendChild(btn);
    });

    // 닉네임 입력
    const input = document.getElementById('nicknameInput');
    const joinBtn = document.getElementById('btnJoin');
    const charCount = document.getElementById('charCount');

    input.addEventListener('input', () => {
      const len = input.value.trim().length;
      charCount.textContent = len;
      joinBtn.disabled = len === 0;
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && input.value.trim()) {
        joinBtn.click();
      }
    });

    joinBtn.addEventListener('click', () => {
      const nickname = input.value.trim();
      if (!nickname) return;

      session.set('myNickname', nickname);
      session.set('myEmoji', selectedEmoji);

      window.location.href = 'group-vote.html';
    });
  </script>
</body>
</html>
